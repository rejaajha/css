    <script>
        //Operator Unary, Binary, dan Ternary

        //Unary Operator
        let x = 10
        typeof "Hello World";

        //Binary Operator
        let sum = 5 + 10;
        x = 1;

        //Ternary Operator
        let result = (x > 0) ? "Positive" : "Non-Positive";
        console.log(result);

        //Assigment Operator
        let z = 20;
        let student = "John Doe";

        student = "Jane Smith";
        console.log(student);
        
        //addition assignment (panambahan dan penugasan)
        let i = 10;
        i -= 5;
        console.log(i)

        //Subtraction assignment (Pengurangan dan penugasan)
        let j = 20;
        j -= 10;
        console.log(j);
        
        //Multiplication assignment (Perkalian dan penugasan)
        let k = 5;
        k *=  4;
        console.log(k);

        //Division Assignment (Pembagian dan penugasan)
        let l = 40;
        l /= 8;
        console.log(l);

        //Modulus Assignment(Sisa bagi dan penugasan)
        let m = 25;
        m %= 4;
        console.log(m);

        //arithmatic operator: increment and decrement

        //increment operator
        let a = 5;
        a++;
        console.log(a);

        //decrement operator
        let b = 10;
        --b;
        console.log(b)
