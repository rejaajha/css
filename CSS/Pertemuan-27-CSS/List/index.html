<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Properti list-style-type</h2>
    <p>contoh daftar yang tidak terurut:</p>
    <ul class="circle">
        <li>Kopi</li>
        <li>Teh</li>
        <li>Coca cola</li>
    </ul>

    <ul class="square">
        <li>Kopi</li>
        <li>Teh</li>
        <li>Coca cola</li>
    </ul>

    <p>Contoh daftar yang terurut:</p>
    <ol class="upper-roman">
        <li>Kopi</li>
        <li>Teh</li>
        <li>Coca cola</li>
    </ol>

    <ol class="lower-alpha">
        <li>Kopi</li>
        <li>Teh</li>
        <li>Coca cola</li>
    </ol>
</body>
</html>
