<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body
    style="
      display: flex;
      background: linear-gradient(
        90deg,
        rgba(131, 58, 180, 1) 0%,
        rgba(253, 29, 29, 1) 50%,
        rgba(252, 176, 69, 1) 100%
      );
      justify-content: center;
      align-content: center;
      align-items: center;
      justify-items: center;
      height: 100vh;
      gap: 70px;
    "
  >
    <img
      src="unnamed.png"
      alt="logo"
      style="
        border-radius: 1000px;
        width: 250px;
        height: auto;
        box-shadow: 0px 0px 20px;
      "
    />
    <div style="display: flexbox">
      <div style="color: white; font-family: sans-serif; line-height: 40px">
        <h1 style="font-size: 60px">Reza Khoirul Azzam</h1>
        <h3 style="font-size: 40px; font-weight: lighter;">Graphic Designer & Web Developer</h3>
      </div>
      <div style="display: flex; gap: 10px">
        <button
          style="
            padding: 10px 20px;
            border-radius: 1000px;
            border: none;
            font-weight: bold;
          "
        >
          Download CV
        </button>
        <button
          style="
            padding: 10px 20px;
            border-radius: 1000px;
            border: none;
            background-color: rgb(0, 206, 120);
            color: white;
            font-weight: bold;
          "
        >
          Hire Me
        </button>
      </div>
    </div>
  </body>
</html>
