<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="pseudo2.css" />
  </head>
  <body>
    <!-- pseudo class - :link -->
    <a href="" class="unvisited">ini adalah link</a>

    <!-- pseudo class - :visited -->
    <a href="" class="visited">ini adalah a:visited</a>

    <!-- pseudo class - :hover -->
    <a href="" class="hover">ini adalah a:hover</a>

    <!-- pseudo class - :active -->
    <a href="" class="active">ini adalah a:active</a>

    <div>ini adalah div:hover</div>

    <input type="text" placeholder="ini adalah input:focus" />

    <div class="p">
      Hover Me To Show The Element
      <p>Tada! im here</p>
    </div>

    <div class="orang-tua">
        <div class="anak-pertama">Pertama</div>
        <div class="anak-kedua">Kedua</div>
        <div class="anak-ketiga">Ketiga</div>
    </div>
  </body>
</html>
